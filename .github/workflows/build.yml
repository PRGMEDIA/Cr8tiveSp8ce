name: Build

# Rebuilds the single-file bundle on every push so dist/ is always fresh.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Syntax-check JavaScript
        run: |
          node --check templates.js
          node --check app.js
          node --check zip.js

      - name: Run regression validation suite
        run: node tests/regression.js

      - name: Rebuild single-file bundle
        run: python tools/build_single.py

      - name: Commit rebuilt bundle
        run: |
          git config user.name "aura-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/aura-studio-single.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: rebuild single-file bundle [skip ci]"
            git push
          fi
