# Aura Studio — build & deploy to IBM Cloud Container Registry (ICR)
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ICR_NAMESPACE      — your IBM Cloud Container Registry namespace
#   IBM_CLOUD_API_KEY  — IBM Cloud API key (IAM) with Container Registry access
#
# Optional (for Code Engine app rollout — add later if wanted):
#   IBM_REGION (default us-south), ICE_PROJECT, ICE_APP_NAME
#
# Until the secrets exist this workflow exits safely at the guard step.

name: Build & deploy (IBM Cloud)

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "**.js"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — skip until ICR secrets are configured
        id: guard
        run: |
          if [ -z "${{ secrets.ICR_NAMESPACE }}" ] || [ -z "${{ secrets.IBM_CLOUD_API_KEY }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ICR secrets not configured — skipping (set ICR_NAMESPACE + IBM_CLOUD_API_KEY)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.enabled == 'true'

      - name: Build image
        if: steps.guard.outputs.enabled == 'true'
        run: |
          docker build -t icr.io/${{ secrets.ICR_NAMESPACE }}/aura-studio:${{ github.sha }} .
          docker tag icr.io/${{ secrets.ICR_NAMESPACE }}/aura-studio:${{ github.sha }} \
                     icr.io/${{ secrets.ICR_NAMESPACE }}/aura-studio:latest

      - name: Push to ICR
        if: steps.guard.outputs.enabled == 'true'
        env:
          ICR_NAMESPACE: ${{ secrets.ICR_NAMESPACE }}
          IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
        run: |
          echo "$IBM_CLOUD_API_KEY" | docker login icr.io -u iamapikey --password-stdin
          docker push icr.io/$ICR_NAMESPACE/aura-studio:${{ github.sha }}
          docker push icr.io/$ICR_NAMESPACE/aura-studio:latest

  deploy-code-engine:
    needs: build-push
    runs-on: ubuntu-latest
    # Opt-in: also add the ICE_PROJECT secret to roll the container out to
    # an IBM Cloud Code Engine application after each push.
    if: needs.build-push.result == 'success' && vars.ICE_PROJECT != ''
    steps:
      - name: Guard
        run: |
          if [ -z "${{ secrets.IBM_CLOUD_API_KEY }}" ]; then echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Install IBM Cloud CLI + Code Engine plugin
        if: steps.guard.outputs.enabled == 'true'
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud plugin install code-engine -f

      - name: Deploy to Code Engine
        if: steps.guard.outputs.enabled == 'true'
        env:
          IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
          ICR_NAMESPACE: ${{ secrets.ICR_NAMESPACE }}
        run: |
          ibmcloud login --apikey "$IBM_CLOUD_API_KEY" -r "${{ vars.IBM_REGION || 'us-south' }}"
          ibmcloud ce project select -n "${{ secrets.ICE_PROJECT }}"
          ibmcloud ce application update --name aura-studio \
            --image icr.io/$ICR_NAMESPACE/aura-studio:${{ github.sha }} \
            --registry-secret icr-secret 2>/dev/null \
            || ibmcloud ce app create --name aura-studio \
            --image icr.io/$ICR_NAMESPACE/aura-studio:${{ github.sha }} \
            --port 80 --min-scale 1
