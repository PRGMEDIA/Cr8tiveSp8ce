# Aura Studio — build & publish container image to GitHub Container Registry (ghcr.io)
#
# ZERO extra secrets needed — the built-in GITHUB_TOKEN handles authentication.
# The image lands at: ghcr.io/prgmedia/aura-studio
#
# To pull locally:
#   docker pull ghcr.io/prgmedia/aura-studio:latest
#
# To run:
#   docker run -p 8080:80 ghcr.io/prgmedia/aura-studio:latest

name: Build & publish container (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/aura-studio:${{ github.sha }} .
          docker tag ghcr.io/${{ github.repository_owner }}/aura-studio:${{ github.sha }} \
                     ghcr.io/${{ github.repository_owner }}/aura-studio:latest

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/aura-studio:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/aura-studio:latest

      - name: Deploy to VPS (optional — requires VPS secrets)
        if: vars.VPS_DEPLOY_ENABLED == 'true'
        run: echo "VPS deploy step — configure your deploy.yml or add SSH deploy here"
