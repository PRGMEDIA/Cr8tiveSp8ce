# Aura Studio — build & publish container image to GitHub Container Registry (ghcr.io)
#
# ZERO extra secrets needed — the built-in GITHUB_TOKEN handles authentication.
# The image name is derived from github.repository, lowercased at runtime, so
# repository renames never break the tag again (I-031: docker requires lowercase).
#
# To pull locally:
#   docker pull ghcr.io/prgmedia/cr8tivesp8ce:latest
#
# To run:
#   docker run -p 8080:80 ghcr.io/prgmedia/cr8tivesp8ce:latest

name: Build & publish container (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compute lowercase image name (rename-safe)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image (clean build, no cache)
        run: |
          IMAGE=${{ steps.img.outputs.name }}
          docker build --no-cache -t ${IMAGE}:${{ github.sha }} .
          docker tag ${IMAGE}:${{ github.sha }} ${IMAGE}:latest
          docker tag ${IMAGE}:${{ github.sha }} ${IMAGE}:v3.3.0
          echo "Built ${IMAGE}"

      - name: Push image
        run: |
          IMAGE=${{ steps.img.outputs.name }}
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:v3.3.0

      - name: Deploy to VPS (optional — requires VPS secrets)
        if: vars.VPS_DEPLOY_ENABLED == 'true'
        run: echo "VPS deploy step — configure your deploy.yml or add SSH deploy here"
